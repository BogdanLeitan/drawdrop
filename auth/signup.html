<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Drawdrop — Create an account</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <input type="checkbox" id="theme" class="theme-switch" hidden />

    <div class="page">
      <header class="top">
        <a class="brand" href="../landing/index.html">
          <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
            <g transform="rotate(-6 20 20)">
              <g fill="currentColor" stroke="currentColor" stroke-width="1.15" stroke-linejoin="round">
                <path opacity="0.4" d="M15.4 6.1 32.8 7.8 24.5 16.4 7 13.5Z" />
                <path opacity="0.76" d="M24.5 16.4 32.8 7.8 34.4 25.6 25.8 33.8Z" />
                <path d="M7 13.5 24.5 16.4 25.8 33.8 8.2 30.6Z" />
              </g>
              <path
                fill="none"
                stroke="#fff"
                stroke-width="1.1"
                stroke-linecap="round"
                opacity="0.4"
                d="M24.5 16.4 7 13.5M24.5 16.4 25.8 33.8"
              />
              <path
                fill="none"
                stroke="#fff"
                stroke-width="2.25"
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M13.5 19.8v8.1m0-8.1c4.55-.2 7.25 1.5 7.25 4.05s-2.65 4.25-7.25 4.05"
              />
            </g>
          </svg>
          <span>Drawdrop</span>
        </a>
        <label class="theme-toggle" for="theme" title="Toggle theme">
          <svg class="theme-moon-icon" viewBox="0 0 20 20" aria-hidden="true">
            <path
              fill="none"
              stroke="currentColor"
              stroke-width="1.25"
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M10 2.5h.328a6.25 6.25 0 0 0 6.6 10.372A7.5 7.5 0 1 1 10 2.493V2.5Z"
            />
          </svg>
          <svg class="theme-sun-icon" viewBox="0 0 20 20" aria-hidden="true">
            <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
              <path d="M10 12.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5ZM10 4.167V2.5M14.167 5.833l1.166-1.166M15.833 10H17.5M14.167 14.167l1.166 1.166M10 15.833V17.5M5.833 14.167l-1.166 1.166M5 10H3.333M5.833 5.833 4.667 4.667" />
            </g>
          </svg>
        </label>
      </header>

      <div class="stage">
        <div class="sketch" aria-hidden="true">
          <svg class="sketch-item sk-box" viewBox="0 0 180 130" data-sketch="box">
            <text class="sketch-text" x="44" y="74">new</text>
          </svg>
          <svg class="sketch-item sk-circle" viewBox="0 0 120 120" data-sketch="diamond"></svg>
          <svg class="sketch-item sk-arrow" viewBox="0 0 200 90" data-sketch="arrow"></svg>
          <svg class="sketch-item sk-check" viewBox="0 0 90 70" data-sketch="check"></svg>
          <svg class="sketch-item sk-line" viewBox="0 0 140 50" data-sketch="line"></svg>
          <p class="sketch-label sk-join">join in</p>
          <p class="sketch-label sk-key">start here</p>
        </div>

        <section class="auth-card island">
          <p class="kicker">new account</p>
          <h1>Sign up</h1>
          <p class="lede">Create an account to keep whiteboards in the cloud.</p>

          <a class="btn btn-google" href="../dashboard/index.html">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="#4285F4"
                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1Z"
              />
              <path
                fill="#34A853"
                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.99.66-2.26 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23Z"
              />
              <path
                fill="#FBBC05"
                d="M5.84 14.09A6.97 6.97 0 0 1 5.48 12c0-.73.13-1.43.36-2.09V7.07H2.18A11.96 11.96 0 0 0 1 12c0 1.94.46 3.77 1.18 5.39l3.66-2.3Z"
              />
              <path
                fill="#EA4335"
                d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53Z"
              />
            </svg>
            Continue with Google
          </a>

          <p class="or">or</p>

          <form class="auth-form" action="../dashboard/index.html" method="get">
            <label>
              Name
              <input type="text" name="name" placeholder="Alex" autocomplete="name" />
            </label>
            <label>
              Email
              <input type="email" name="email" placeholder="you@studio.com" autocomplete="email" />
            </label>
            <label>
              Password
              <input type="password" name="password" placeholder="••••••••" autocomplete="new-password" />
            </label>
            <button class="btn btn-primary" type="submit">Create account</button>
          </form>

          <p class="switch-text">
            Already have an account?
            <a href="./signin.html">Sign in</a>
          </p>
          <p class="note">Cloud is $3/month. You can start free in the browser anytime.</p>
        </section>
      </div>
    </div>

    <script src="https://unpkg.com/roughjs@4.6.6/bundled/rough.js"></script>
    <script src="./sketch.js"></script>
  </body>
</html>
